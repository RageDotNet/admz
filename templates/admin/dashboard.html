{% from "admin/macros.html" import zbuild_head, zbuild_foot %}
{{ zbuild_head("A2A DMZ Admin") }}

<div
  class="z-container z-margin-large-top"
  data-signals="{activeTab: 'reviews', reviewNotes: '', detailRequestId: null}"
>
  <div class="z-flex z-flex-between z-flex-middle z-margin-bottom">
    <div>
      <h1 class="z-margin-remove">A2A DMZ Gateway</h1>
      <p class="z-text-muted z-margin-remove">Signed in as <strong>{{ agent_id }}</strong></p>
    </div>
    <form data-on:submit__prevent="@post('/admin/logout')">
      <button class="z-button z-button-default" type="submit">Sign out</button>
    </form>
  </div>

  <div
    data-init="@get('/admin/partials/stats')"
    data-on-interval__throttle_5s="@get('/admin/partials/stats')"
  >
    <div id="stats-panel"></div>
  </div>

  <div class="z-button-group z-margin-bottom z-margin-top">
    <button
      type="button"
      class="z-button"
      data-class="{'z-button-primary': $activeTab === 'reviews'}"
      data-on:click="$detailRequestId = null; $activeTab = 'reviews'; @get('/admin/partials/reviews')"
    >Review queue</button>
    <button
      type="button"
      class="z-button"
      data-class="{'z-button-primary': $activeTab === 'inflight'}"
      data-on:click="$detailRequestId = null; $activeTab = 'inflight'; @get('/admin/partials/inflight')"
    >In-flight</button>
    <button
      type="button"
      class="z-button"
      data-class="{'z-button-primary': $activeTab === 'log'}"
      data-on:click="$detailRequestId = null; $activeTab = 'log'; @get('/admin/partials/log')"
    >Access log</button>
    <button
      type="button"
      class="z-button"
      data-class="{'z-button-primary': $activeTab === 'schemas'}"
      data-on:click="$detailRequestId = null; $activeTab = 'schemas'; @get('/admin/partials/schemas')"
    >Schemas</button>
  </div>

  <div data-show="$activeTab === 'reviews'">
    <div
      id="reviews-content"
      data-init="@get('/admin/partials/reviews')"
      data-on-interval__throttle_5s="$activeTab === 'reviews' && @get('/admin/partials/reviews')"
    ></div>
  </div>

  <div data-show="$activeTab === 'inflight'">
    <div
      id="inflight-content"
      data-init="$activeTab === 'inflight' && @get('/admin/partials/inflight')"
      data-on-interval__throttle_3s="$activeTab === 'inflight' && @get('/admin/partials/inflight')"
    ></div>
  </div>

  <div data-show="$activeTab === 'log'">
    <div
      id="log-content"
      data-init="$activeTab === 'log' && @get('/admin/partials/log')"
    ></div>
  </div>

  <div data-show="$activeTab === 'schemas'">
    <div
      id="schemas-content"
      data-init="$activeTab === 'schemas' && @get('/admin/partials/schemas')"
    ></div>
  </div>
</div>

{{ zbuild_foot() }}
