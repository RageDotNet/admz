[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admz"
version = "0.2.1"
description = "Agent DMZ v2 — directory-driven broker between untrusted LLM agents"
license = "MIT"
authors = [
    { name = "Greg Retkowski", email = "greg@rage.net" },
]
# Deployment targets Python 3.12 (docs/infra-v2.md); local dev venv is 3.11, so
# the floor is 3.11 while CI/Docker images pin 3.12.
requires-python = ">=3.11,<3.14"
dependencies = [
    "Flask>=3.0,<4",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "litellm>=1.40,<2",
    "PyYAML>=6.0,<7",
    "datastar-py>=1.0.2,<1.1",
    "dydantic>=0.0.8,<0.1",
    "jsonschema>=4.21,<5",
    "email-validator>=2.0,<3",
    "gunicorn>=21.2,<24",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.4",
    "mypy>=1.8",
    "fabric>=3,<4",
]

[project.scripts]
dmz-serve = "admz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admz = ["templates/*.html", "templates/**/*.html", "static/*", "static/vendor/*", "skills/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["admz"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "examples"]
