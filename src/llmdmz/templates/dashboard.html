<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM DMZ Admin</title>
  <script>
    // Bootstrap color-mode init (before paint): honour saved or system preference.
    if (localStorage.getItem("bs-theme") === "dark" ||
        (!localStorage.getItem("bs-theme") &&
         window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-bs-theme", "dark");
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.3.min.css') }}">
  <script type="module" src="{{ url_for('static', filename='vendor/datastar-1.0.2.js') }}"></script>
</head>
<body>
<div class="container py-4" data-signals="{tab: 'directory'}">
  <h1 class="h3 mb-3">LLM DMZ — Admin Console</h1>
  <div id="stats-bar" class="mb-3">{% include "partials/stats_placeholder.html" %}</div>
  <nav class="d-flex flex-wrap gap-2 align-items-center nav nav-tabs mb-3" role="tablist">
    <a class="nav-link" role="tab" href="#directory"
       data-attr-class="$tab==='directory' ? 'nav-link active' : 'nav-link'"
       data-on:click="$tab='directory'">Directory</a>
    <a class="nav-link" role="tab" href="#enrollments"
       data-attr-class="$tab==='enrollments' ? 'nav-link active' : 'nav-link'"
       data-on:click="$tab='enrollments'">Enrollments</a>
    <a class="nav-link" role="tab" href="#agents"
       data-attr-class="$tab==='agents' ? 'nav-link active' : 'nav-link'"
       data-on:click="$tab='agents'">Agents</a>
    <a class="nav-link" role="tab" href="#log"
       data-attr-class="$tab==='log' ? 'nav-link active' : 'nav-link'"
       data-on:click="$tab='log'">Request log</a>
    <a class="nav-link" role="tab" href="#audit"
       data-attr-class="$tab==='audit' ? 'nav-link active' : 'nav-link'"
       data-on:click="$tab='audit'">Audit trail</a>
    <form class="ms-auto" method="post" action="{{ url_for('admin.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn btn-sm btn-outline-secondary">Log out ({{ admin }})</button>
    </form>
  </nav>

  <section id="directory" data-show="$tab==='directory'">
    <div id="directory-list" data-init="@get('/admin/partials/directory')"></div>
  </section>
  <section id="enrollments" data-show="$tab==='enrollments'">
    <h2 class="h5 mt-3">Pending version approvals</h2>
    <div id="pending-versions">{{ pending_versions | safe }}</div>
    <h2 class="h5 mt-4">Enrollment requests</h2>
    <div id="pending-enrollments" data-init="@get('/admin/partials/enrollments')"></div>
  </section>
  <section id="agents" data-show="$tab==='agents'">
    <div id="agents-list" data-init="@get('/admin/partials/agents', {openWhenHidden: true})"></div>
  </section>
  <section id="log" data-show="$tab==='log'">
    <div id="log-list" data-init="@get('/admin/partials/log')"></div>
  </section>
  <section id="audit" data-show="$tab==='audit'">
    <div id="audit-list" data-init="@get('/admin/partials/audit')"></div>
  </section>
</div>
</body>
</html>
