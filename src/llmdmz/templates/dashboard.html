<!DOCTYPE html>
<html lang="en" class="z-layout-small">
<head>
  <meta charset="utf-8">
  <title>LLM DMZ Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/0build-kit.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <script>
    // 0build theme init (per https://0build.dev/docs/latest/kit/installation/)
    const htmlElement = document.documentElement;
    const __Z_THEME__ = JSON.parse(localStorage.getItem("__Z_THEME__") || "{}");
    if (__Z_THEME__.mode === "dark" ||
        (!__Z_THEME__.mode && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      htmlElement.classList.add("dark");
    } else {
      htmlElement.classList.remove("dark");
    }
    htmlElement.classList.add(__Z_THEME__.layout || "z-layout-small");
  </script>
  <script type="module" src="{{ url_for('static', filename='vendor/datastar-1.0.2.js') }}"></script>
</head>
<body class="bg color" style="--bg: var(--z-bg); --color: var(--z-bg-f)">
<div class="z-container" data-signals="{tab: 'directory'}">
  <h1>LLM DMZ â€” Admin Console</h1>
  <div id="stats-bar">{% include "partials/stats_placeholder.html" %}</div>
  <nav class="z-tab" role="tablist">
    <a class="z-tab" role="tab" href="#directory" data-on:click="$tab='directory'"
       data-attr-aria-selected="$tab==='directory' ? 'true' : 'false'">Directory</a>
    <a class="z-tab" role="tab" href="#enrollments" data-on:click="$tab='enrollments'"
       data-attr-aria-selected="$tab==='enrollments' ? 'true' : 'false'">Enrollments</a>
    <a class="z-tab" role="tab" href="#agents" data-on:click="$tab='agents'"
       data-attr-aria-selected="$tab=='agents' ? 'true' : 'false'">Agents</a>
    <a class="z-tab" role="tab" href="#log" data-on:click="$tab='log'"
       data-attr-aria-selected="$tab==='log' ? 'true' : 'false'">Request log</a>
    <a class="z-tab" role="tab" href="#audit" data-on:click="$tab='audit'"
       data-attr-aria-selected="$tab==='audit' ? 'true' : 'false'">Audit trail</a>
    <span class="grow"></span>
    <form class="z-flex z-flex-top" method="post" action="{{ url_for('admin.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="z-button">Log out ({{ admin }})</button>
    </form>
  </nav>

  <section id="directory" data-show="$tab==='directory'">
    <div id="directory-list" data-init="@get('/admin/partials/directory')"></div>
  </section>
  <section id="enrollments" data-show="$tab==='enrollments'">
    <h2>Pending version approvals</h2>
    <div id="pending-versions">{{ pending_versions | safe }}</div>
    <h2>Enrollment requests</h2>
    <div id="pending-enrollments" data-init="@get('/admin/partials/enrollments')"></div>
  </section>
  <section id="agents" data-show="$tab=='agents'" xdata-show="true">
    <div id="agents-list" data-init="@get('/admin/partials/agents', {openWhenHidden: true})"></div>
  </section>
  <section id="log" data-show="$tab==='log'">
    <div id="log-list" data-init="@get('/admin/partials/log')"></div>
  </section>
  <section id="audit" data-show="$tab==='audit'">
    <div id="audit-list" data-init="@get('/admin/partials/audit')"></div>
  </section>
</div>
</body>
</html>
