<div class="card card-body" id="agent-{{ agent.id }}-detail">
  {% if saved %}<p class="alert alert-success py-2 mb-2">Saved.</p>{% endif %}
  <h3>{{ agent.name }} <span class="small text-body-secondary mono">{{ agent.id }}</span></h3>
  <!-- Delivery config: full values shown/prefilled — admin-only console. -->
  <p class="small text-body-secondary">Delivery config: {{ 'configured (' ~ (agent.delivery_config.protocol if agent.delivery_config else '') ~ ')' if agent.delivery_config else 'not configured' }}</p>
  <form class="d-flex flex-column gap-2" data-on:submit="@post('/admin/agents/{{ agent.id }}', {contentType: 'form'})">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="small text-body-secondary"><input type="checkbox" name="is_client" {% if agent.is_client %}checked{% endif %}> client</label>
    <label class="small text-body-secondary"><input type="checkbox" name="is_provider" data-bind="$provider"
      {% if agent.is_provider %}checked{% endif %}> provider</label>
    <label class="small text-body-secondary"><input type="checkbox" name="enabled" {% if not agent.disabled %}checked{% endif %}> enabled</label>
    {% include "partials/delivery_fields.html" %}
    <button type="submit" class="btn btn-sm btn-primary align-self-start">Save</button>
  </form>
</div>
