<div>
  <form class="row" data-on-submit="@get(&quot;/admin/partials/log?&quot; + $formData)">
    <input type="text" name="action_id" value="{{ action_id }}" placeholder="action id">
    <select name="outcome">
      <option value="">any outcome</option>
      {% for o in ("completed", "request_schema_invalid", "arbiter_rejected", "provider_failed", "arbiter_unavailable", "internal_error") %}
      <option value="{{ o }}" {% if outcome == o %}selected{% endif %}>{{ o }}</option>
      {% endfor %}
    </select>
    <button type="submit">Filter</button>
  </form>
  <table>
    <thead><tr><th>When</th><th>Action</th><th>Agent</th><th>Outcome</th><th></th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td class="small">{{ r.created_at }}</td>
        <td class="small">{{ r.action_id }}</td>
        <td class="small mono">{{ r.agent_id[:8] }}</td>
        <td><span class="badge {{ r.outcome }}">{{ r.outcome }}</span></td>
        <td><a href="#" data-on-click="@get(&quot;/admin/partials/request/{{ r.id }}&quot;)">detail</a></td>
      </tr>
    {% else %}
      <tr><td colspan="5" class="muted">No requests.</td></tr>
    {% endfor %}
    </tbody>
  </table>
  <div class="pager">
    <span class="muted small">{{ total }} total — page {{ page }}</span>
    {% if page > 1 %}<a class="btn" href="#" data-on-click="@get(&quot;/admin/partials/log?page={{ page - 1 }}&quot;)">Prev</a>{% endif %}
    {% if page * per_page < total %}<a class="btn" href="#" data-on-click="@get(&quot;/admin/partials/log?page={{ page + 1 }}&quot;)">Next</a>{% endif %}
  </div>
  <div id="request-detail"></div>
</div>
