<table class="table table-sm table-hover table-striped align-middle">
  <thead><tr><th>Client</th><th>Action</th><th>Requested</th><th></th></tr></thead>
  <tbody>
  {% for row in rows %}
    <tr id="enrollment-{{ row.enrollment.id }}">
      <td>{{ row.agent.name if row.agent else row.enrollment.agent_id }}</td>
      <td>{{ row.enrollment.action_id }}</td>
      <td class="small text-body-secondary">{{ row.enrollment.requested_at }}</td>
      <td>
        <form class="d-flex flex-wrap gap-2 align-items-center" data-on:submit="@post(&quot;/admin/enrollment/{{ row.enrollment.id }}/approve&quot;, {contentType: &quot;form&quot;})">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="text" name="notes" class="form-control form-control-sm small text-body-secondary" placeholder="notes">
          <button class="btn btn-sm btn-primary" type="submit">Approve</button>
        </form>
        <form class="d-flex flex-wrap gap-2 align-items-center" data-on:submit="@post(&quot;/admin/enrollment/{{ row.enrollment.id }}/reject&quot;, {contentType: &quot;form&quot;})">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn btn-sm btn-danger" type="submit">Reject</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="4" class="small text-body-secondary">No pending enrollment requests.</td></tr>
  {% endfor %}
  </tbody>
</table>
