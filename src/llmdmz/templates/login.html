<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM DMZ Admin — Login</title>
  <script>
    if (localStorage.getItem("bs-theme") === "dark" ||
        (!localStorage.getItem("bs-theme") &&
         window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-bs-theme", "dark");
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.3.min.css') }}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
<div class="container" style="max-width: 28rem;">
  <div class="card">
    <div class="card-body">
      <h1 class="h4 mb-3">LLM DMZ — Admin Login</h1>
      {% if error %}<p class="alert alert-danger py-2">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('admin.login_post') }}" class="d-flex flex-column gap-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username" autocomplete="username">
        </div>
        <div>
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary align-self-start">Log in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
