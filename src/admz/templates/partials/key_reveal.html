<div class="card border-warning" data-signals="{keyCopied: false}">
  <div class="card-body">
    <strong>Agent key — shown exactly once.</strong>
    <p class="small mb-2">Copy it now. It is stored only as a hash and cannot be displayed again.</p>
    <pre id="agent-key-once" class="font-monospace bg-body-tertiary p-2 rounded mb-2">{{ key }}</pre>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <button type="button" class="btn btn-sm btn-primary" data-on:click="__adminCopyText('agent-key-once'); $keyCopied = true">Copy</button>
      <span class="small text-success" data-show="$keyCopied">Copied</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-on:click="@get('/admin/partials/agents')">Dismiss</button>
    </div>
  </div>
</div>
