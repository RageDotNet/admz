<div class="card border-warning" data-signals="{keyCopied: false, promptCopied: false}">
  <div class="card-body">
    <strong>Agent key — shown exactly once.</strong>
    <p class="small mb-2">Copy it now. It is stored only as a hash and cannot be displayed again.</p>
    <pre id="agent-key-once" class="font-monospace bg-body-tertiary p-2 rounded mb-2">{{ key }}</pre>
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <button type="button" class="btn btn-sm btn-primary" data-on:click="$keyCopied = __adminCopyText('agent-key-once')">Copy</button>
      <span class="small text-success" data-show="$keyCopied">Copied</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-on:click="@get('/admin/partials/agents')">Dismiss</button>
    </div>
    <label class="form-label" for="agent-onboard-prompt">Paste this prompt to your agent:</label>
    <textarea id="agent-onboard-prompt" class="form-control font-monospace small mb-2" rows="14" readonly>{{ prompt }}</textarea>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <button type="button" class="btn btn-sm btn-outline-primary" data-on:click="$promptCopied = __adminCopyText('agent-onboard-prompt')">Copy prompt</button>
      <span class="small text-success" data-show="$promptCopied">Copied</span>
    </div>
  </div>
</div>
