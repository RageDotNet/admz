<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Agent DMZ</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="32x32">
  <script>
    if (localStorage.getItem("bs-theme") === "dark" ||
        (!localStorage.getItem("bs-theme") &&
         window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-bs-theme", "dark");
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-5.3.3.min.css') }}">
</head>
<body class="bg-body-tertiary min-vh-100 d-flex align-items-center">
<div class="container" style="max-width: 28rem;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Agent DMZ</h1>
      <p class="small text-body-secondary mb-3">Admin</p>
      {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('admin.login_post') }}" class="d-flex flex-column gap-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username" autocomplete="username" required value="{{ username|default('') }}"{% if not error %} autofocus{% endif %}>
        </div>
        <div>
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required{% if error %} autofocus{% endif %}>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
