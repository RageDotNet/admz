services:
  dmz:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: admz:v2
    ports:
      - "${DMZ_APP_PORT:-8000}:8000"
    environment:
      DMZ_CONFIG: /etc/dmz/config.yaml
      DMZ_DATABASE_URL: sqlite:////var/lib/dmz/dmz.db
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Repo-root `.env` (OPENROUTER_API_KEY, OPENAI_API_KEY, ARBITER_MODEL, …). Do not set
    # those keys under `environment` with `${VAR:-default}` — compose
    # interpolates from `deploy/` (not the repo `.env`) and a default like
    # `openai/gpt-4o-mini` would override both `.env` and config.yaml.
    env_file:
      - path: ../.env
        required: false
    volumes:
      - dmz-data:/var/lib/dmz
      - ../config.yaml:/etc/dmz/config.yaml:ro
    restart: unless-stopped

volumes:
  dmz-data:
